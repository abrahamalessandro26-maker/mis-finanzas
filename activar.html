<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Activar acceso</title><meta name="theme-color" content="#000000"><meta name="robots" content="noindex"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mis finanzas"><style>:root{color-scheme:dark;--bg:#000;--card:#101010;--tx:#f2f2f2;--tx2:#9a9a9a;--bd:#2a2a2a;--ac:#85B7EB;--ok:#97C459;--bad:#F09595;--warn:#FAC775}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}main{max-width:460px;margin:0 auto;padding:24px 16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}h1{font-size:22px;margin:8px 0}p{color:var(--tx2);margin:6px 0 12px}input,button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:#000;color:var(--tx);padding:12px;width:100%}button{cursor:pointer;margin-top:8px}button.p{background:var(--ac);color:#000;border:0;font-weight:700}#err{color:var(--bad);min-height:20px;margin-top:8px;font-size:14px}</style></head><body><main>
<div style="font-size:42px;text-align:center">💰</div><h1 style="text-align:center">Mis finanzas</h1><p style="text-align:center">Escribe tu código de acceso para entrar.</p>
<div class="card" id="ins" hidden><b style="color:var(--tx)">📲 Primero instala la app</b><p style="margin:4px 0 8px">Así queda como un ícono en tu celular y no pierdes tus datos.</p><div id="insSteps" style="font-size:14px;color:var(--tx2)"></div><button class="p" id="insBtn" hidden>Instalar ahora</button></div>
<div class="card"><input id="c" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" maxlength="9" style="text-align:center;letter-spacing:3px;font-size:20px"><button class="p" id="go">Entrar</button><div id="err"></div></div>
<p style="text-align:center;font-size:13px">¿No tienes código? Pídelo a quien te compartió la app.</p>
</main><script>
var $=function(i){return document.getElementById(i)};
try{if(location.hash.indexOf('#migrar=')===0)sessionStorage.setItem('mig',location.hash)}catch(e){}

function instInfo(){var ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),and=/Android/.test(ua),
 sa=false;try{sa=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}catch(e){}
 var inapp=/FBAN|FBAV|Instagram|TikTok|musical_ly|Line\/|Messenger|; wv\)/.test(ua);return {ios:ios,and:and,sa:sa,inapp:inapp,mobile:ios||and}}
function instSteps(I){var h='';
 if(I.inapp)h+='<p style="margin:0 0 8px;color:var(--warn)"><b>Estás dentro de otra app (WhatsApp, Instagram, Facebook...).</b> Primero ábrelo en el navegador: toca los tres puntitos y elige <b>'+(I.ios?'Abrir en Safari':'Abrir en Chrome')+'</b>.</p>';
 if(I.ios)h+='<ol style="margin:0;padding-left:20px"><li>Usa <b>Safari</b>.</li><li>Toca el ícono <b>≡</b> (a la izquierda de la dirección) o el botón <b>Compartir</b>.</li><li>Elige <b>Agregar a pantalla de inicio</b> y toca <b>Agregar</b>.</li><li>Abre el ícono <b>Mis finanzas</b> y escribe tu código <b>ahí</b>, no aquí.</li></ol>';
 else h+='<ol style="margin:0;padding-left:20px"><li>Usa <b>Chrome</b>.</li><li>Toca los <b>tres puntitos ⋮</b> (arriba a la derecha).</li><li>Elige <b>Instalar aplicación</b> o <b>Agregar a la pantalla de inicio</b> y confirma con <b>Instalar</b> o <b>Agregar</b>.</li><li>Abre el ícono <b>Mis finanzas</b> desde tu pantalla de inicio.</li></ol>';
 return h}
(function(){var I=instInfo();if(!I.mobile||I.sa)return;$('ins').hidden=false;$('insSteps').innerHTML=instSteps(I);
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();var b=$('insBtn');b.hidden=false;b.onclick=function(){e.prompt()}})})();
var q=new URLSearchParams(location.search).get('c');if(q)$('c').value=q;
$('c').oninput=function(){var raw=this.value.toUpperCase(),v=raw.replace(/[^A-Z0-9]/g,'').slice(0,8);this.value=v.length>4?v.slice(0,4)+'-'+v.slice(4):(v.length===4&&/-$/.test(raw)?v+'-':v)};
function go(){var b=$('go');b.disabled=true;$('err').textContent='';
 fetch('/api/activar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('c').value})})
 .then(function(r){return r.json()}).then(function(d){
  if(d.ok){var h='';try{h=sessionStorage.getItem('mig')||'';sessionStorage.removeItem('mig')}catch(e){}location.replace('/'+h)}
  else{$('err').textContent=d.error||'No se pudo activar.';b.disabled=false}})
 .catch(function(){$('err').textContent='Sin conexión. Intenta de nuevo.';b.disabled=false})}
$('go').onclick=go;$('c').onkeydown=function(e){if(e.key==='Enter')go()};
</script></body></html>
